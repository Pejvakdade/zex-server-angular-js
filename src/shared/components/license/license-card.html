<div style="display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px">
  <svg
    width="22"
    height="22"
    viewBox="0 0 24 24"
    fill="none"
    stroke="#1269E8"
    stroke-width="1.8"
    style="flex-shrink: 0; margin-top: 2px"
  >
    <circle cx="8" cy="15" r="3.5" />
    <path d="M10.5 12.5L20 3M16.5 6.5l2.5 2.5M14 9l2.5 2.5" />
  </svg>
  <div style="font-weight: 800; font-size: 15px; color: var(--zx-primary-deep); line-height: 1.3">
    {{ license().name }}
  </div>
</div>
<div style="font-size: 12.5px; color: var(--zx-text-faint); line-height: 1.55; margin-bottom: 14px">
  {{ license().description }}
</div>

<div style="display: grid; gap: 7px; font-size: 12.5px; color: var(--zx-text); margin-bottom: 18px">
  @for (feature of license().features; track feature) {
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="color: var(--zx-violet); font-weight: 800">&#10003;</span>{{ feature }}
    </div>
  }
</div>

<div style="margin-top: auto; display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px">
  <span style="font-size: 12px; color: var(--zx-text-faint); font-weight: 600">From</span>
  <span style="font-size: 26px; font-weight: 800; color: var(--zx-primary-deep)"
    >${{ total() }}</span
  >
  <span style="font-size: 12px; color: var(--zx-text-faint)">{{
    installing() ? 'first month' : '/mo'
  }}</span>
</div>

@if (license().installFee > 0) {
  <label
    class="install-toggle"
    (click)="$event.stopPropagation()"
    style="
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: var(--zx-bg-tint);
      border-radius: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      border: 1.5px solid transparent;
    "
  >
    <div
      style="
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--zx-text);
        font-weight: 600;
      "
    >
      <input
        type="checkbox"
        [checked]="installing()"
        (change)="onToggle($event)"
        style="flex-shrink: 0; accent-color: var(--zx-primary)"
      />Install License
    </div>
    <div style="font-size: 13px; font-weight: 800; color: var(--zx-ink)">
      +${{ license().installFeeStr }}
      <span style="font-size: 11px; font-weight: 600; color: var(--zx-text-faint)">one-off</span>
    </div>
  </label>
}

<ng-content />
