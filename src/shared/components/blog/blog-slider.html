<section class="slider" tabindex="0" aria-roledescription="carousel" [attr.aria-label]="heading()">
  <div class="head">
    <div>
      <h2 class="heading">{{ heading() }}</h2>
      <p class="sub">{{ subheading() }}</p>
    </div>
    <div class="controls">
      <a class="all" [routerLink]="routes.Blog">All posts &rarr;</a>
      @if (pageCount() > 1) {
        <button type="button" class="arrow" (click)="prev()" aria-label="Previous posts">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <button type="button" class="arrow" (click)="next()" aria-label="Next posts">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
      }
    </div>
  </div>

  <div
    #viewport
    class="viewport"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <div class="track" [style.transform]="offset()">
      @for (post of posts(); track post._id) {
        <div class="slide" [style.flex-basis]="cardWidth()">
          <zx-blog-card [post]="post" />
        </div>
      }
    </div>
  </div>

  @if (pageCount() > 1) {
    <div class="dots" role="tablist">
      @for (page of pages(); track page) {
        <button
          type="button"
          class="dot"
          [class.active]="page === index()"
          (click)="goTo(page)"
          role="tab"
          [attr.aria-selected]="page === index()"
          [attr.aria-label]="'Go to page ' + (page + 1)"
        ></button>
      }
    </div>
  }
</section>
