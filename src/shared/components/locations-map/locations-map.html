<div class="zx-map-card">
  <svg
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-label="Global datacenter locations"
  >
    <defs>
      <radialGradient id="zx-map-glow">
        <stop offset="0%" stop-color="#1269E8" stop-opacity="0.35" />
        <stop offset="100%" stop-color="#1269E8" stop-opacity="0" />
      </radialGradient>
    </defs>

    <path
      [attr.d]="landPath"
      style="fill: var(--zx-map-land); stroke: var(--zx-bg)"
      stroke-width="1.2"
    />
    <path
      [attr.d]="bordersPath"
      fill="none"
      style="stroke: var(--zx-map-border)"
      stroke-width="0.8"
    />

    @for (arc of arcs(); track $index) {
      <path
        [attr.d]="arc"
        fill="none"
        stroke="#1269E8"
        stroke-opacity="0.28"
        stroke-width="1.4"
        stroke-dasharray="6 7"
      />
    }

    @for (m of markers(); track m.city) {
      <g
        class="zx-map-marker"
        [class.zx-map-marker--active]="m.city === selected()"
        role="button"
        tabindex="0"
        [attr.aria-label]="'Show plans in ' + m.city"
        [attr.aria-pressed]="m.city === selected()"
        [attr.transform]="'translate(' + m.x + ',' + m.y + ')'"
        (click)="select.emit(m.city)"
        (keydown.enter)="select.emit(m.city)"
        (keydown.space)="select.emit(m.city); $event.preventDefault()"
      >
        <circle r="24" fill="url(#zx-map-glow)" />
        <circle r="5" fill="#1269E8" opacity="0.3">
          <animate
            attributeName="r"
            values="5;16;5"
            dur="3s"
            [attr.begin]="m.delay"
            repeatCount="indefinite"
          />
        </circle>
        @if (m.anchor !== 'middle') {
          <line
            x1="0"
            y1="-8"
            [attr.x2]="leaderX(m)"
            [attr.y2]="m.dy - 6"
            style="stroke: var(--zx-map-leader)"
            stroke-width="1.4"
          />
        }
        <circle class="zx-map-dot" r="6" fill="#fff" stroke="#1269E8" stroke-width="3" />
        <text class="zx-map-label" [attr.x]="m.dx" [attr.y]="m.dy" [attr.text-anchor]="m.anchor">
          {{ m.city }}
        </text>
      </g>
    }
  </svg>
</div>
