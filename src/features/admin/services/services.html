<div>
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    "
  >
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button
          type="button"
          (click)="setStatus(null)"
          [style]="store.filters().status === null ? ui.chipActive : ui.chip"
        >
          All
        </button>
        @for (s of statuses; track s) {
          <button
            type="button"
            (click)="setStatus(s)"
            [style]="store.filters().status === s ? ui.chipActive : ui.chip"
          >
            {{ s }}
          </button>
        }
      </div>
      <select
        [value]="store.filters().product ?? ''"
        (change)="onProduct($event)"
        [style]="ui.select"
      >
        <option value="">All products</option>
        @for (p of products; track p) {
          <option [value]="p">{{ p }}</option>
        }
      </select>
      <input
        type="text"
        [value]="store.filters().search ?? ''"
        (change)="onSearch($event)"
        placeholder="Search id, plan or customer..."
        [style]="ui.search"
      />
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="font-size: 13px; color: var(--zx-text-faint)"
        >{{ store.page().totalDocs }} services</span
      >
      <button type="button" (click)="openCreate()" [style]="ui.addBtn">+ Provision service</button>
    </div>
  </div>

  @if (store.error() && !modalOpen()) {
    <div
      style="
        font-size: 13px;
        color: var(--zx-red-fg);
        background: var(--zx-red-tint);
        border: 1px solid var(--zx-red-border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 14px;
      "
    >
      {{ store.error() }}
    </div>
  }

  <zx-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="store.loading()"
    emptyText="No services match."
    (edit)="openEdit($event)"
    (remove)="deleting.set($any($event))"
  />

  <zx-pager [page]="store.page()" (goTo)="goTo($event)" />

  @if (modalOpen()) {
    <zx-entity-modal
      [title]="editing() ? 'Edit service' : 'Provision service'"
      [fields]="fields()"
      [initial]="draft()"
      [saving]="store.saving()"
      [error]="store.error()"
      (save)="save($event)"
      (cancel)="modalOpen.set(false)"
    />
  }

  @if (deleting(); as row) {
    <zx-confirm-dialog
      [label]="row.label"
      [busy]="store.saving()"
      (confirm)="confirmDelete()"
      (cancel)="deleting.set(null)"
    />
  }
</div>
