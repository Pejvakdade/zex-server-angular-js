<div>
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    "
  >
    <span style="font-size: 13px; color: #8386ac"
      >{{ store.page().totalDocs }} console accounts</span
    >
    <button type="button" (click)="openAdd()" [style]="ui.addBtn">+ Add Staff member</button>
  </div>

  @if (store.error() && !modalOpen()) {
    <div
      style="
        font-size: 13px;
        color: #dc2626;
        background: #fff6f6;
        border: 1px solid #fbd5d5;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 14px;
      "
    >
      {{ store.error() }}
    </div>
  }

  <zx-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="store.loading()"
    emptyText="No console accounts."
    (edit)="openEdit($event)"
    (remove)="deleting.set($any($event))"
  />

  @if (modalOpen()) {
    <zx-entity-modal
      [title]="editing() ? 'Edit account' : 'Add staff member'"
      [fields]="fields()"
      [initial]="draft()"
      [saving]="store.saving()"
      [error]="store.error()"
      (save)="save($event)"
      (cancel)="modalOpen.set(false)"
    />
  }

  @if (deleting(); as row) {
    <zx-confirm-dialog
      [label]="row.label"
      [busy]="store.saving()"
      (confirm)="confirmDelete()"
      (cancel)="deleting.set(null)"
    />
  }
</div>
