<div>
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    "
  >
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button
          type="button"
          (click)="store.setProduct(allProducts)"
          [style]="store.product() === allProducts ? ui.chipActive : ui.chip"
        >
          All
        </button>
        @for (p of products; track p) {
          <button
            type="button"
            (click)="store.setProduct(p)"
            [style]="store.product() === p ? ui.chipActive : ui.chip"
          >
            {{ p }}
          </button>
        }
      </div>
      <select [value]="store.location()" (change)="onLocation($event)" [style]="ui.select">
        <option [value]="allLocations">All locations</option>
        @for (city of cities(); track city) {
          <option [value]="city">{{ city }}</option>
        }
      </select>
      <input
        type="text"
        [value]="store.search()"
        (input)="onSearch($event)"
        placeholder="Search plans by name..."
        [style]="ui.search"
      />
    </div>
    <button type="button" (click)="openAdd()" [style]="ui.addBtn">+ Add Plan</button>
  </div>

  @if (store.error() && !modalOpen()) {
    <div
      style="
        font-size: 13px;
        color: var(--zx-red-fg);
        background: var(--zx-red-tint);
        border: 1px solid var(--zx-red-border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 14px;
      "
    >
      {{ store.error() }}
    </div>
  }

  <zx-data-table
    [columns]="columns"
    [rows]="rows()"
    [loading]="store.loading()"
    emptyText="No plans match these filters."
    (edit)="openEdit($event)"
    (remove)="deleting.set($any($event))"
  />

  @if (modalOpen()) {
    <zx-entity-modal
      [title]="editing() ? 'Edit plan' : 'Add plan'"
      [fields]="modalFields()"
      [initial]="draft()"
      [saving]="store.saving()"
      [error]="store.error()"
      (fieldChange)="onFieldChange($event)"
      (save)="save($event)"
      (cancel)="modalOpen.set(false)"
    />
  }

  @if (deleting(); as row) {
    <zx-confirm-dialog
      [label]="row.label"
      [busy]="store.saving()"
      (confirm)="confirmDelete()"
      (cancel)="deleting.set(null)"
    />
  }
</div>
