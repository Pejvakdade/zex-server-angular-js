server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular is a single-page app: every unknown path must fall through to index.html
  # so the router - not nginx - resolves it.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API: forward to the backend container (compose service name `backend`) so the
  # browser never crosses origins and CORS stays out of the picture.
  # The upstream is held in a variable and resolved through Docker's embedded DNS at request time,
  # otherwise nginx refuses to start whenever no `backend` container exists (frontend-only runs).
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hero banners uploaded from the dashboard are served by the backend from its `public/` folder.
  # `^~` so this prefix wins over the image-extension regex below, which would 404 them from the SPA root.
  location ^~ /uploads/ {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 30d;
    access_log off;
  }

  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    expires 30d;
    access_log off;
  }
}
